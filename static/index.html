<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f3ead9">
    <meta name="description" content="小满，一个会记得你的 AI 伙伴">
    <title>小满 · 记得你的 AI 伙伴</title>

    <!-- 样式加载顺序：控件 → 组件 → 骨架。
         layout.css 必须放最后，因为断点写在里面，要靠「后加载」压过组件自己的基础样式。 -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/chat.css">
    <link rel="stylesheet" href="/static/css/layout.css">
</head>
<body>

    <!-- 登录 / 注册 -->
    <section id="auth-view">
        <div class="auth-card">
            <div class="auth-logo">✦</div>
            <h2 id="auth-title">欢迎回来</h2>
            <p class="auth-sub" id="auth-sub">登录后开始对话</p>

            <div class="auth-tabs">
                <button id="tab-login" class="active" type="button">登录</button>
                <button id="tab-register" type="button">注册</button>
            </div>

            <div class="field">
                <label for="auth-username">用户名</label>
                <input id="auth-username" type="text" placeholder="输入用户名" autocomplete="username">
            </div>
            <div class="field">
                <label for="auth-password">密码</label>
                <input id="auth-password" type="password" placeholder="输入密码" autocomplete="current-password">
            </div>
            <div class="field" id="confirm-field" hidden>
                <label for="auth-confirm">确认密码</label>
                <input id="auth-confirm" type="password" placeholder="再次输入密码" autocomplete="new-password">
            </div>

            <button class="auth-btn" id="auth-submit" type="button">登录</button>
            <p class="auth-msg" id="auth-msg"></p>
        </div>
    </section>

    <!-- 应用主体：登录成功后显示 -->
    <div id="app" hidden>
        <main>
            <header>
                <div class="brand">
                    <div class="brand-mark" aria-hidden="true">✦</div>
                    <div class="brand-text">
                        <h1 id="chat-title">小满</h1>
                        <span class="brand-sub"><i class="live-dot"></i>记得你们聊过的事</span>
                    </div>
                </div>
                <span class="spacer"></span>
                <div class="user-wrap">
                    <button class="user-cell" id="user-menu-btn" type="button">
                        <span class="user-name" id="user-name">用户</span>
                        <span class="user-dots" aria-hidden="true"><i></i><i></i><i></i></span>
                    </button>
                    <div class="user-menu" id="user-menu" hidden>
                        <button class="user-menu-item" id="menu-brain" type="button">记忆大脑</button>
                        <button class="user-menu-item" id="menu-config" type="button">设置</button>
                        <button class="user-menu-item" id="menu-logout" type="button">退出登录</button>
                    </div>
                </div>
            </header>

            <!-- 消息区：欢迎页 与 消息列表 二选一 -->
            <div id="output">
                <section id="welcome" class="welcome">
                    <div class="logo">✦</div>
                    <h2>我在呢</h2>
                    <p>随便聊点什么，你说过的事我会记着</p>
                    <div class="suggestions">
                        <button class="suggestion" data-prompt="今天有点累，想找人说说话">今天有点累</button>
                        <button class="suggestion" data-prompt="跟你说件开心的事">跟你说件开心的事</button>
                        <button class="suggestion" data-prompt="你还记得我上次跟你说过什么吗？">你还记得我上次说的吗</button>
                    </div>
                </section>

                <div id="messages" class="messages" hidden></div>
            </div>

            <div class="composer">
                <div class="composer-inner">
                    <textarea id="msg" rows="1" placeholder="输入消息，回车发送…" autocomplete="off"></textarea>
                    <div class="composer-bar">
                        <span class="hint">Enter 发送 · Shift + Enter 换行</span>
                        <span class="spacer"></span>
                        <span class="chip model-chip">DeepSeek</span>
                        <button class="chip chip-btn" id="api-key-chip" type="button" title="配置 API Key">API Key</button>
                        <button id="send" disabled title="发送">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- API Key 配置弹窗 -->
    <div class="modal-overlay" id="api-key-modal" hidden>
        <div class="modal-card">
            <h3 class="modal-title">API Key 配置</h3>
            <p class="modal-desc">填写你的 DeepSeek API Key，保存后对话将使用该 Key 调用模型，不占用每日免费额度。未配置时使用服务端默认配置，每天有额度限制。</p>
            <div class="field">
                <label for="api-key-input">API Key</label>
                <input id="api-key-input" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
            </div>
            <p class="modal-status" id="api-key-status"></p>
            <div class="modal-actions">
                <button class="btn btn-ghost btn-test" id="api-key-test" type="button">测试</button>
                <button class="btn btn-ghost" id="api-key-cancel" type="button">取消</button>
                <button class="btn btn-primary" id="api-key-save" type="button">保存</button>
            </div>
        </div>
    </div>

    <!-- 唯一入口：内部按 state → api → ui → chat 的顺序依赖 -->
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
