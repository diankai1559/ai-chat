<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f3ead9">
    <meta name="description" content="小满，一个会记得你的 AI 伙伴">
    <title>小满 · 记得你的 AI 伙伴</title>
    <style>
        :root {
            --bg: hsl(38, 44%, 94%);           /* 米黄底 */
            --bg-deep: hsl(34, 38%, 90%);
            --panel: hsl(35, 34%, 89%);
            --line: hsl(34, 26%, 81%);
            --txt: hsl(24, 26%, 19%);
            --sub: hsl(28, 14%, 44%);
            --accent: hsl(34, 55%, 78%);       /* 暖沙金 */
            --accent-deep: hsl(24, 42%, 48%);  /* 陶土棕，用于强调 */
            --hover: hsl(35, 36%, 85%);
            --pending: hsl(38, 40%, 91%);
            --field: hsl(40, 62%, 98%);
            --shadow: 0 18px 44px hsla(30, 30%, 42%, 0.13);
            --ring: 0 0 0 4px hsla(34, 55%, 70%, 0.22);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        [hidden] { display: none !important; }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
            background:
                radial-gradient(1200px 620px at 50% -16%, hsl(40, 60%, 97%), transparent 68%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            color: var(--txt);
            height: 100vh;
            display: flex;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        #app { display: flex; flex: 1; min-width: 0; }

        /* ---------- 登录 / 注册 ---------- */
        #auth-view {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(1100px 560px at 50% -12%, hsl(48, 55%, 92%), transparent),
                var(--bg);
        }

        .auth-card {
            width: 100%;
            max-width: 380px;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 32px 30px 28px;
            box-shadow: 0 20px 50px hsla(40, 30%, 50%, 0.16);
        }

        .auth-logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--accent);
            color: hsl(30, 20%, 18%);
            font-size: 26px;
            line-height: 52px;
            text-align: center;
            margin: 0 auto 18px;
        }

        .auth-card h2 {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin: 0 0 6px;
        }

        .auth-sub {
            text-align: center;
            font-size: 13px;
            color: var(--sub);
            margin: 0 0 24px;
        }

        .auth-tabs {
            display: flex;
            background: var(--panel);
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 24px;
        }

        .auth-tabs button {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--sub);
            font-family: inherit;
            font-size: 13.5px;
            padding: 7px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color .35s ease, color .35s ease;
        }
        .auth-tabs button.active {
            background: var(--accent);
            color: hsl(30, 20%, 18%);
        }

        .field { margin-bottom: 16px; }
        .field label {
            display: block;
            font-size: 12.5px;
            color: var(--sub);
            margin-bottom: 7px;
        }
        .field input {
            width: 100%;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--txt);
            font-family: inherit;
            font-size: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            outline: none;
            user-select: text;
            transition: border-color .3s ease, box-shadow .3s ease;
        }
        .field input::placeholder { color: var(--sub); }
        .field input:focus {
            border-color: hsl(45, 40%, 60%);
            box-shadow: 0 0 0 3px hsla(48, 50%, 70%, 0.25);
        }

        .auth-btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: hsl(30, 20%, 18%);
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 600;
            padding: 11px 0;
            cursor: pointer;
            margin-top: 6px;
            transition: filter .3s ease, opacity .3s ease;
        }
        .auth-btn:hover { filter: brightness(1.05); }
        .auth-btn:disabled { opacity: .6; cursor: not-allowed; filter: none; }

        .auth-msg {
            min-height: 18px;
            font-size: 12.5px;
            color: hsl(10, 42%, 52%);
            text-align: center;
            margin-top: 14px;
        }

        /* ---------- 侧边栏 ---------- */
        aside {
            width: 248px;
            height: 100vh;
            background: var(--panel);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }

        .side-top {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--sub);
            font-family: inherit;
            font-size: 13.5px;
            text-align: left;
            cursor: pointer;
        }
        .nav-item svg { width: 16px; height: 16px; flex: none; }
        .nav-item:hover { background: var(--hover); color: var(--txt); }
        .nav-item.active { background: var(--accent); color: hsl(30, 20%, 18%); }

        .chats-label {
            padding: 12px 20px 6px;
            font-size: 11px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--sub);
            flex-shrink: 0;
        }

        .session-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            list-style: none;
            padding: 0 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        /* 主题化细滚动条（只用 webkit 规则，勿与 scrollbar-width 混用） */
        .session-list::-webkit-scrollbar { width: 6px; }
        .session-list::-webkit-scrollbar-track { background: transparent; }
        .session-list::-webkit-scrollbar-button { display: none; height: 0; width: 0; }
        .session-list::-webkit-scrollbar-thumb {
            background: hsla(45, 22%, 68%, 0.5);
            border-radius: 999px;
        }
        .session-list::-webkit-scrollbar-thumb:hover {
            background: hsla(45, 25%, 55%, 0.8);
        }

        .session-item {
            flex-shrink: 0;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--sub);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background-color 0.45s cubic-bezier(.2,.7,.3,1),
                        color 0.35s ease,
                        box-shadow 0.45s ease;
        }
        .session-item:hover { background: var(--hover); color: var(--txt); }
        .session-item.active {
            background: var(--accent);
            color: hsl(30, 20%, 18%);
            box-shadow: 0 1px 3px hsla(45, 40%, 60%, 0.25);
        }

        /* 占位态：暖米色素描，等智能命名后柔滑过渡到米黄高亮 */
        .session-item.pending {
            background: var(--pending);
            color: hsl(40, 18%, 38%);
            box-shadow: inset 0 0 0 1px hsla(45, 30%, 72%, 0.6),
                        0 1px 6px hsla(48, 42%, 62%, 0.18);
            animation: pending-glow 2.8s ease-in-out infinite;
            cursor: default;
        }
        @keyframes pending-glow {
            0%, 100% {
                box-shadow: inset 0 0 0 1px hsla(45, 30%, 72%, 0.6),
                            0 1px 6px hsla(48, 42%, 62%, 0.18);
            }
            50% {
                box-shadow: inset 0 0 0 1px hsla(48, 40%, 65%, 0.55),
                            0 2px 10px hsla(48, 45%, 60%, 0.28);
            }
        }

        .side-bottom {
            position: relative;
            padding: 10px;
            border-top: 1px solid var(--line);
            flex-shrink: 0;
        }

        /* ---------- 底部用户栏 + 弹出菜单 ---------- */
        .user-cell {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 9px 10px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: var(--sub);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: background-color .35s ease, color .35s ease;
        }
        .user-cell:hover { background: var(--hover); color: var(--txt); }

        .user-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: left;
        }

        .user-dots {
            flex: none;
            display: inline-flex;
            gap: 2.5px;
            align-items: center;
        }
        .user-dots i {
            width: 3.5px;
            height: 3.5px;
            border-radius: 50%;
            background: currentColor;
        }

        .user-menu {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 10px;
            right: 10px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 6px;
            box-shadow: 0 12px 30px hsla(40, 30%, 40%, 0.18);
            z-index: 20;
            animation: menu-in .22s cubic-bezier(.2,.7,.3,1);
        }
        @keyframes menu-in {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-menu-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--sub);
            font-family: inherit;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            transition: background-color .3s ease, color .3s ease;
        }
        .user-menu-item:hover { background: var(--hover); color: var(--txt); }

        /* ---------- 主区域 ---------- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        header {
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 22px;
            border-bottom: 1px solid var(--line);
        }

        #chat-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--txt);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #output {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        /* ---------- 新会话欢迎页 ---------- */
        .welcome {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .welcome .logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--accent);
            color: hsl(30, 20%, 18%);
            font-size: 26px;
            line-height: 52px;
            margin-bottom: 18px;
        }

        .welcome h2 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 600;
        }

        .welcome p {
            margin: 0;
            font-size: 14px;
            color: var(--sub);
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 22px;
            max-width: 520px;
        }

        .suggestion {
            padding: 8px 16px;
            font-size: 13px;
            color: var(--txt);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
        }
        .suggestion:hover { background: var(--hover); }

        /* ---------- 消息列表 ---------- */
        .messages {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            user-select: text;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: hsl(30, 20%, 18%);
        }

        .msg.ai {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid var(--line);
        }

        /* 等待回复时的三点流动动画 */
        .msg.typing .dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            height: 1.5em;
            vertical-align: middle;
        }
        .msg.typing .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--sub);
            animation: typing-flow 1.2s infinite ease-in-out;
        }
        .msg.typing .dots span:nth-child(2) { animation-delay: 0.2s; }
        .msg.typing .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing-flow {
            0%, 60%, 100% { opacity: 0.25; transform: scale(0.75); }
            30% { opacity: 1; transform: scale(1.3); background: var(--accent); }
        }

        /* ---------- 输入栏（圆角卡片 + 工具栏） ---------- */
        .composer { padding: 10px 24px 20px; }

        .composer-inner {
            max-width: 760px;
            margin: 0 auto;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px 14px 8px;
        }

        #msg {
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: var(--txt);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            max-height: 200px;
            user-select: text;
        }
        #msg::placeholder { color: var(--sub); }

        .composer-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .spacer { flex: 1; }

        .icon-btn {
            width: 30px;
            height: 30px;
            flex: none;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: transparent;
            color: var(--sub);
            cursor: pointer;
        }
        .icon-btn svg { width: 15px; height: 15px; }
        .icon-btn:hover { background: var(--hover); color: var(--txt); }

        .chip {
            font-size: 12px;
            color: var(--sub);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 4px 10px;
            white-space: nowrap;
        }

        /* API Key 配置入口 */
        .chip-btn {
            font-family: inherit;
            cursor: pointer;
            background: transparent;
            transition: background-color .3s ease, color .3s ease;
        }
        .chip-btn:hover { background: var(--hover); color: var(--txt); }
        .chip-btn.configured::after {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            margin-left: 6px;
            border-radius: 50%;
            background: hsl(48, 55%, 50%);
            vertical-align: middle;
        }

        /* ---------- API Key 配置弹窗 ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: hsla(35, 25%, 18%, 0.35);
            animation: fade-in .25s ease;
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-card {
            width: 100%;
            max-width: 400px;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 50px hsla(40, 30%, 40%, 0.25);
            animation: menu-in .25s cubic-bezier(.2,.7,.3,1);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 4px;
        }

        .modal-desc {
            font-size: 12.5px;
            color: var(--sub);
            line-height: 1.6;
            margin: 0 0 18px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        .btn {
            padding: 8px 16px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-family: inherit;
            font-size: 13.5px;
            cursor: pointer;
            transition: filter .3s ease, background-color .3s ease, color .3s ease;
        }
        .btn-primary {
            background: var(--accent);
            color: hsl(30, 20%, 18%);
            border-color: transparent;
        }
        .btn-primary:hover { filter: brightness(1.05); }
        .btn-ghost { background: transparent; color: var(--sub); }
        .btn-ghost:hover { background: var(--hover); color: var(--txt); }
        .btn:disabled { opacity: .6; cursor: not-allowed; filter: none; }

        .btn-test { margin-right: auto; }

        .modal-status {
            min-height: 16px;
            font-size: 12.5px;
            margin: 0 0 4px;
        }
        .modal-status.ok { color: hsl(120, 30%, 38%); }
        .modal-status.err { color: hsl(10, 42%, 52%); }

        #send {
            width: 32px;
            height: 32px;
            flex: none;
            display: grid;
            place-items: center;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            color: hsl(30, 20%, 18%);
            cursor: pointer;
        }
        #send svg { width: 16px; height: 16px; }
        #send:hover { filter: brightness(1.08); }
        #send:disabled {
            background: hsl(48, 25%, 80%);
            color: var(--sub);
            cursor: not-allowed;
            filter: none;
        }
        /* ==================== 视觉升级 ==================== */

        /* 手机键盘：--kb 由 visualViewport 实时计算，输入区平滑上移而不是瞬间跳动 */
        #app {
            padding-bottom: var(--kb, 0px);
            transition: padding-bottom .22s cubic-bezier(.2,.7,.3,1);
        }
        @supports (height: 100dvh) {
            html, body { height: 100dvh; }
        }
        #output { overscroll-behavior-y: contain; }

        /* 顶部栏：品牌 + 用户菜单，替代原来的左侧栏 */
        header {
            height: 64px;
            padding: 0 26px;
            background: hsla(40, 62%, 98%, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
            position: relative;
            z-index: 10;
        }

        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

        .brand-mark {
            width: 34px; height: 34px;
            flex: none;
            display: grid; place-items: center;
            border-radius: 11px;
            background: linear-gradient(145deg, hsl(40, 70%, 90%), var(--accent));
            color: hsl(24, 38%, 30%);
            font-size: 17px;
            box-shadow: 0 6px 16px hsla(30, 40%, 50%, 0.18);
        }

        .brand-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .brand-text h1 { font-size: 15px; font-weight: 600; letter-spacing: .2px; }

        .brand-sub {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 11.5px; color: var(--sub);
        }

        .live-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: hsl(140, 34%, 52%);
            box-shadow: 0 0 0 0 hsla(140, 34%, 52%, 0.45);
            animation: live-pulse 2.6s ease-in-out infinite;
        }
        @keyframes live-pulse {
            0%, 100% { box-shadow: 0 0 0 0 hsla(140, 34%, 52%, 0.4); }
            50% { box-shadow: 0 0 0 5px hsla(140, 34%, 52%, 0); }
        }

        .user-wrap { position: relative; flex: none; }

        header .user-cell {
            width: auto;
            padding: 7px 12px;
            gap: 8px;
            border-radius: 999px;
            border: 1px solid transparent;
        }
        header .user-cell:hover { border-color: var(--line); }

        header .user-menu {
            top: calc(100% + 8px);
            right: 0;
            left: auto;
            bottom: auto;
            min-width: 168px;
            background: var(--field);
            box-shadow: var(--shadow);
        }

        /* 欢迎页 */
        .welcome .logo {
            width: 64px; height: 64px;
            border-radius: 20px;
            font-size: 30px;
            line-height: 64px;
            background: linear-gradient(150deg, hsl(42, 74%, 92%), var(--accent));
            box-shadow: 0 14px 34px hsla(30, 42%, 50%, 0.2);
            animation: float-soft 5.5s ease-in-out infinite;
        }
        @keyframes float-soft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .welcome h2 {
            font-family: "Songti SC", "Noto Serif SC", "PingFang SC", serif;
            font-size: 27px;
            letter-spacing: .5px;
        }

        .welcome p { color: var(--sub); }

        .suggestion {
            background: var(--field);
            border-color: var(--line);
            padding: 9px 18px;
            transition: transform .25s cubic-bezier(.2,.7,.3,1),
                        background-color .3s ease,
                        box-shadow .3s ease;
        }
        .suggestion:hover {
            background: var(--field);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px hsla(30, 35%, 50%, 0.14);
        }

        /* 消息气泡 */
        .messages { max-width: 760px; padding: 30px 22px 12px; gap: 18px; }

        .msg {
            max-width: 74%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14.5px;
            line-height: 1.72;
            box-shadow: 0 2px 10px hsla(30, 30%, 50%, 0.06);
            animation: msg-in .34s cubic-bezier(.2,.7,.3,1);
        }
        @keyframes msg-in {
            from { opacity: 0; transform: translateY(7px) scale(.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .msg.user {
            background: linear-gradient(150deg, hsl(38, 66%, 84%), var(--accent));
            border-bottom-right-radius: 6px;
            box-shadow: 0 8px 20px hsla(30, 40%, 52%, 0.16);
        }

        .msg.ai {
            background: var(--field);
            border: 1px solid var(--line);
            border-bottom-left-radius: 6px;
        }

        /* 输入区 */
        .composer { padding: 8px 24px 20px; }
        .composer-inner {
            padding: 13px 16px 9px;
            border-radius: 20px;
            box-shadow: 0 10px 30px hsla(30, 30%, 50%, 0.08);
            transition: border-color .3s ease, box-shadow .3s ease;
        }
        .composer-inner:focus-within {
            border-color: hsl(34, 45%, 68%);
            box-shadow: var(--ring), 0 10px 30px hsla(30, 30%, 50%, 0.1);
        }

        .hint { font-size: 11.5px; color: var(--sub); opacity: .85; }
        .model-chip { opacity: .75; }

        #send {
            width: 34px; height: 34px;
            background: linear-gradient(145deg, hsl(38, 68%, 82%), var(--accent));
            transition: transform .22s cubic-bezier(.2,.7,.3,1),
                        filter .25s ease,
                        box-shadow .25s ease;
        }
        #send:not(:disabled):hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
            box-shadow: 0 7px 16px hsla(30, 40%, 50%, 0.22);
        }

        /* 登录卡片 */
        .auth-card {
            background: linear-gradient(180deg, hsl(40, 66%, 99%), var(--field));
            box-shadow: var(--shadow);
        }
        .auth-logo {
            background: linear-gradient(150deg, hsl(42, 74%, 92%), var(--accent));
            box-shadow: 0 10px 24px hsla(30, 42%, 50%, 0.18);
        }
        .auth-btn {
            background: linear-gradient(145deg, hsl(38, 68%, 82%), var(--accent));
            transition: transform .2s ease, filter .25s ease, box-shadow .25s ease;
        }
        .auth-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px hsla(30, 40%, 50%, 0.2);
        }

        /* 滚动条 */
        #output::-webkit-scrollbar { width: 8px; }
        #output::-webkit-scrollbar-track { background: transparent; }
        #output::-webkit-scrollbar-thumb {
            background: hsla(34, 28%, 74%, 0.65);
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: content-box;
        }
        #output::-webkit-scrollbar-thumb:hover { background-color: hsla(32, 34%, 62%, 0.85); }

        /* 手机端 */
        @media (max-width: 720px) {
            header { height: 58px; padding: 0 14px; }
            .brand { gap: 9px; }
            .brand-mark { width: 30px; height: 30px; border-radius: 9px; font-size: 15px; }
            .brand-sub { display: none; }
            header .user-cell { padding: 6px 9px; }
            .user-name { max-width: 76px; }

            .messages { padding: 18px 14px 8px; gap: 14px; }
            .msg { max-width: 86%; font-size: 14px; }

            .composer { padding: 6px 12px calc(12px + env(safe-area-inset-bottom)); }
            .composer-inner { border-radius: 18px; padding: 11px 12px 8px; }
            .hint, .model-chip { display: none; }

            .welcome h2 { font-size: 23px; }
            .welcome .logo { width: 56px; height: 56px; line-height: 56px; font-size: 26px; }
            .suggestions { max-width: 100%; }
            .suggestion { font-size: 12.5px; padding: 8px 14px; }

            .auth-card { padding: 28px 22px 24px; border-radius: 18px; }
        }

        /* 桌面端：不再像被拉宽的手机页，内容区与字号一起放大 */
        @media (min-width: 1024px) {
            header { height: 70px; padding: 0 40px; }
            .brand-mark { width: 38px; height: 38px; border-radius: 12px; font-size: 18px; }
            .brand-text h1 { font-size: 16px; }
            .brand-sub { font-size: 12px; }

            .messages { max-width: 880px; padding: 42px 32px 18px; gap: 20px; }
            .msg { max-width: 68%; font-size: 15px; padding: 13px 18px; }

            .composer { padding: 10px 32px 26px; }
            .composer-inner { max-width: 880px; padding: 15px 18px 10px; }
            #msg { font-size: 15px; }

            .welcome h2 { font-size: 32px; }
            .welcome p { font-size: 15px; }
            .welcome .logo { width: 72px; height: 72px; line-height: 72px; font-size: 34px; }

            .auth-card { max-width: 420px; padding: 38px 36px 32px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- 登录 / 注册 -->
    <section id="auth-view">
        <div class="auth-card">
            <div class="auth-logo">✦</div>
            <h2 id="auth-title">欢迎回来</h2>
            <p class="auth-sub" id="auth-sub">登录后开始对话</p>

            <div class="auth-tabs">
                <button id="tab-login" class="active" type="button">登录</button>
                <button id="tab-register" type="button">注册</button>
            </div>

            <div class="field">
                <label for="auth-username">用户名</label>
                <input id="auth-username" type="text" placeholder="输入用户名" autocomplete="username">
            </div>
            <div class="field">
                <label for="auth-password">密码</label>
                <input id="auth-password" type="password" placeholder="输入密码" autocomplete="current-password">
            </div>
            <div class="field" id="confirm-field" hidden>
                <label for="auth-confirm">确认密码</label>
                <input id="auth-confirm" type="password" placeholder="再次输入密码" autocomplete="new-password">
            </div>

            <button class="auth-btn" id="auth-submit" type="button">登录</button>
            <p class="auth-msg" id="auth-msg"></p>
        </div>
    </section>

    <!-- 应用主体 -->
    <div id="app" hidden>

    <!-- 主区域 -->
    <main>
        <header>
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">✦</div>
                <div class="brand-text">
                    <h1 id="chat-title">小满</h1>
                    <span class="brand-sub"><i class="live-dot"></i>记得你们聊过的事</span>
                </div>
            </div>
            <span class="spacer"></span>
            <div class="user-wrap">
                <button class="user-cell" id="user-menu-btn" type="button">
                    <span class="user-name" id="user-name">用户</span>
                    <span class="user-dots" aria-hidden="true"><i></i><i></i><i></i></span>
                </button>
                <div class="user-menu" id="user-menu" hidden>
                    <button class="user-menu-item" id="menu-config" type="button">设置</button>
                    <button class="user-menu-item" id="menu-logout" type="button">退出登录</button>
                </div>
            </div>
        </header>

        <!-- 消息区：欢迎页 与 消息列表 二选一 -->
        <div id="output">
            <!-- 新会话欢迎页 -->
            <section id="welcome" class="welcome">
                <div class="logo">✦</div>
                <h2>我在呢</h2>
                <p>随便聊点什么，你说过的事我会记着</p>
                <div class="suggestions">
                    <button class="suggestion" data-prompt="今天有点累，想找人说说话">今天有点累</button>
                    <button class="suggestion" data-prompt="跟你说件开心的事">跟你说件开心的事</button>
                    <button class="suggestion" data-prompt="你还记得我上次跟你说过什么吗？">你还记得我上次说的吗</button>
                </div>
            </section>

            <!-- 消息列表 -->
            <div id="messages" class="messages" hidden></div>
        </div>

        <div class="composer">
            <div class="composer-inner">
                <textarea id="msg" rows="1" placeholder="输入消息，回车发送…" autocomplete="off"></textarea>
                <div class="composer-bar">
                    <span class="hint">Enter 发送 · Shift + Enter 换行</span>
                    <span class="spacer"></span>
                    <span class="chip model-chip">DeepSeek</span>
                    <button class="chip chip-btn" id="api-key-chip" type="button" title="配置 API Key">API Key</button>
                    <button id="send" disabled title="发送">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>
    </div><!-- /#app -->

    <!-- API Key 配置弹窗 -->
    <div class="modal-overlay" id="api-key-modal" hidden>
        <div class="modal-card">
            <h3 class="modal-title">API Key 配置</h3>
            <p class="modal-desc">填写你的 DeepSeek API Key，保存后对话将使用该 Key 调用模型。未配置时使用服务端默认配置。</p>
            <div class="field">
                <label for="api-key-input">API Key</label>
                <input id="api-key-input" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
            </div>
            <p class="modal-status" id="api-key-status"></p>
            <div class="modal-actions">
                <button class="btn btn-ghost btn-test" id="api-key-test" type="button">测试</button>
                <button class="btn btn-ghost" id="api-key-cancel" type="button">取消</button>
                <button class="btn btn-primary" id="api-key-save" type="button">保存</button>
            </div>
        </div>
    </div>

<script>
    /* ==================== 认证 ==================== */
    const TOKEN_KEY = "ai_chat_token";
    const USER_KEY = "ai_chat_username";
    let authToken = localStorage.getItem(TOKEN_KEY) || null;

    const authView = document.getElementById("auth-view");
    const appEl = document.getElementById("app");
    const userNameEl = document.getElementById("user-name");

    function authHeaders() {
        return authToken ? {"Authorization": "Bearer " + authToken} : {};
    }

    function showAuth() {
        authToken = null;
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_KEY);
        appEl.hidden = true;
        authView.hidden = false;
        setTimeout(() => document.getElementById("auth-username").focus(), 0);
    }

    function hideAuth() {
        authView.hidden = true;
        appEl.hidden = false;
    }

    // 登录 / 注册切换与提交
    let authMode = "login";
    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const authTitle = document.getElementById("auth-title");
    const authSub = document.getElementById("auth-sub");
    const confirmField = document.getElementById("confirm-field");
    const authSubmit = document.getElementById("auth-submit");
    const authMsg = document.getElementById("auth-msg");
    const usernameInput = document.getElementById("auth-username");
    const passwordInput = document.getElementById("auth-password");
    const confirmInput = document.getElementById("auth-confirm");

    function setAuthMode(mode) {
        authMode = mode;
        const isLogin = mode === "login";
        tabLogin.classList.toggle("active", isLogin);
        tabRegister.classList.toggle("active", !isLogin);
        confirmField.hidden = isLogin;
        authTitle.textContent = isLogin ? "欢迎回来" : "创建账号";
        authSub.textContent = isLogin ? "登录后开始对话" : "注册一个新账号";
        authSubmit.textContent = isLogin ? "登录" : "注册";
        passwordInput.setAttribute("autocomplete", isLogin ? "current-password" : "new-password");
        authMsg.textContent = "";
        usernameInput.focus();
    }

    tabLogin.addEventListener("click", () => setAuthMode("login"));
    tabRegister.addEventListener("click", () => setAuthMode("register"));

    function clearAuthFields() {
        usernameInput.value = "";
        passwordInput.value = "";
        confirmInput.value = "";
    }

    authSubmit.addEventListener("click", async () => {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        authMsg.textContent = "";

        if (!username || !password) {
            authMsg.textContent = "请输入用户名和密码";
            return;
        }
        if (authMode === "register") {
            if (password.length < 6) {
                authMsg.textContent = "密码至少 6 位";
                return;
            }
            if (password !== confirmInput.value) {
                authMsg.textContent = "两次输入的密码不一致";
                return;
            }
        }

        authSubmit.disabled = true;
        try {
            const r = await fetch("/" + authMode, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username, password})
            });
            const data = await r.json().catch(() => ({}));

            if (!r.ok) {
                authMsg.textContent = typeof data.detail === "string" ? data.detail : ("请求失败 " + r.status);
                return;
            }

            // 注册成功后跳转到登录页，让用户手动登录
            if (authMode === "register") {
                clearAuthFields();
                setAuthMode("login");
                authMsg.textContent = "注册成功，请登录";
                return;
            }

            authToken = data.access_token;
            localStorage.setItem(TOKEN_KEY, authToken);
            localStorage.setItem(USER_KEY, username);
            userNameEl.textContent = username;
            clearAuthFields();
            hideAuth();
            init();
        } catch (e) {
            authMsg.textContent = "网络错误，请稍后重试";
        } finally {
            authSubmit.disabled = false;
        }
    });

    [passwordInput, confirmInput].forEach(input => {
        input.addEventListener("keydown", e => {
            if (e.key === "Enter" && !authSubmit.disabled) {
                e.preventDefault();
                authSubmit.click();
            }
        });
    });

    /* ==================== 底部用户菜单 ==================== */
    const userMenuBtn = document.getElementById("user-menu-btn");
    const userMenu = document.getElementById("user-menu");

    userMenuBtn.addEventListener("click", e => {
        e.stopPropagation();
        userMenu.hidden = !userMenu.hidden;
    });

    document.addEventListener("click", e => {
        if (!userMenu.hidden && !userMenu.contains(e.target) && e.target !== userMenuBtn) {
            userMenu.hidden = true;
        }
    });

    document.getElementById("menu-config").addEventListener("click", () => {
        userMenu.hidden = true;
        document.getElementById("api-key-chip").click();
    });

    document.getElementById("menu-logout").addEventListener("click", () => {
        userMenu.hidden = true;
        showAuth();
    });

    /* 点击非可选中区域时清除文本选区（body 为 user-select:none，浏览器不会自动取消） */
    document.addEventListener("mousedown", e => {
        if (e.target.closest(".msg, #msg, .field input")) return;
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed) sel.removeAllRanges();
    });

    /* ==================== API Key 配置 ==================== */
    const API_KEY_STORE = "ai_chat_api_key";
    let apiKey = localStorage.getItem(API_KEY_STORE) || "";

    const apiKeyChip = document.getElementById("api-key-chip");
    const apiKeyModal = document.getElementById("api-key-modal");
    const apiKeyInput = document.getElementById("api-key-input");
    const apiKeySave = document.getElementById("api-key-save");
    const apiKeyCancel = document.getElementById("api-key-cancel");
    const apiKeyTest = document.getElementById("api-key-test");
    const apiKeyStatus = document.getElementById("api-key-status");

    function apiKeyHeaders() {
        return apiKey ? {"X-API-Key": apiKey} : {};
    }

    function refreshApiKeyChip() {
        apiKeyChip.classList.toggle("configured", !!apiKey);
    }

    function clearApiKeyStatus() {
        apiKeyStatus.textContent = "";
        apiKeyStatus.className = "modal-status";
    }

    apiKeyChip.addEventListener("click", () => {
        apiKeyInput.value = apiKey;
        clearApiKeyStatus();
        apiKeyModal.hidden = false;
        setTimeout(() => apiKeyInput.focus(), 0);
    });

    apiKeyCancel.addEventListener("click", () => { apiKeyModal.hidden = true; });
    apiKeyModal.addEventListener("click", e => {
        if (e.target === apiKeyModal) apiKeyModal.hidden = true;
    });

    apiKeyTest.addEventListener("click", async () => {
        const value = apiKeyInput.value.trim();
        if (!value) {
            apiKeyStatus.textContent = "请先输入 API Key";
            apiKeyStatus.className = "modal-status err";
            return;
        }
        apiKeyTest.disabled = true;
        apiKeyStatus.textContent = "测试中…";
        apiKeyStatus.className = "modal-status";
        try {
            const r = await fetch("/api-key/test", {
                method: "POST",
                headers: {"X-API-Key": value, ...authHeaders()}
            });
            const data = await r.json().catch(() => ({}));
            const ok = r.ok && data.ok;
            apiKeyStatus.textContent = data.message || (r.ok ? "连接成功" : "测试失败");
            apiKeyStatus.className = "modal-status " + (ok ? "ok" : "err");
        } catch (e) {
            apiKeyStatus.textContent = "网络错误，请稍后重试";
            apiKeyStatus.className = "modal-status err";
        } finally {
            apiKeyTest.disabled = false;
        }
    });

    apiKeySave.addEventListener("click", () => {
        const value = apiKeyInput.value.trim();
        if (!value) { apiKeyInput.focus(); return; }
        apiKey = value;
        localStorage.setItem(API_KEY_STORE, apiKey);
        refreshApiKeyChip();
        apiKeyModal.hidden = true;
    });

    apiKeyInput.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); apiKeySave.click(); }
        if (e.key === "Escape") apiKeyModal.hidden = true;
    });

    const outputEl = document.getElementById("output");
    const welcomeEl = document.getElementById("welcome");
    const messagesEl = document.getElementById("messages");
    const msgInput = document.getElementById("msg");
    const sendBtn = document.getElementById("send");
    const titleEl = document.getElementById("chat-title");

    // 单会话：没有会话列表，历史按 id 游标向上翻页
    let historyBefore = null;
    let hasMoreHistory = false;
    let loadingHistory = false;

    /* ==================== 手机键盘与视口 ==================== */
    // 输入法弹出时，visualViewport 变矮；用这部分高度把输入区顶上去，
    // 并把“原本就在底部”的聊天记录一起向上贴住，滚上去时不强行拉回。
    let pinnedToBottom = true;

    function isNearBottom() {
        return outputEl.scrollHeight - outputEl.scrollTop - outputEl.clientHeight < 48;
    }

    outputEl.addEventListener("scroll", () => {
        pinnedToBottom = isNearBottom();
    }, {passive: true});

    function keepPinned(duration) {
        const end = performance.now() + duration;
        const step = () => {
            outputEl.scrollTop = outputEl.scrollHeight;
            if (performance.now() < end) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
    }

    function syncViewport() {
        const vv = window.visualViewport;
        const keyboard = vv ? Math.max(0, window.innerHeight - vv.height) : 0;
        document.documentElement.style.setProperty("--kb", keyboard + "px");
        if (pinnedToBottom) keepPinned(keyboard > 0 ? 340 : 240);
    }

    if (window.visualViewport) {
        let pending = 0;
        const schedule = () => {
            if (pending) return;
            pending = requestAnimationFrame(() => {
                pending = 0;
                syncViewport();
            });
        };
        window.visualViewport.addEventListener("resize", schedule);
        window.visualViewport.addEventListener("scroll", schedule);
        window.addEventListener("resize", schedule);
    }

    msgInput.addEventListener("focus", () => {
        pinnedToBottom = isNearBottom();
    });

    /* ==================== 视图切换 ==================== */

    function scrollToLatest(loadingEl) {
        outputEl.scrollTop = outputEl.scrollHeight;

        const outputTop = outputEl.getBoundingClientRect().top;
        const loadingTop = loadingEl.getBoundingClientRect().top;

        if (loadingTop < outputTop) {
            outputEl.scrollTop -= (outputTop - loadingTop);
        }
    }

    function showWelcome() {
        messagesEl.innerHTML = "";
        messagesEl.hidden = true;
        welcomeEl.hidden = false;
        outputEl.scrollTop = 0;
        titleEl.textContent = "小满";
    }

    function showMessages() {
        welcomeEl.hidden = true;
        messagesEl.hidden = false;
        // 手机端不自动聚焦：一进页面就弹键盘会挡住内容，也让视口突然变化
        if (window.matchMedia("(pointer: fine)").matches) msgInput.focus();
    }

    function makeMessage(role, text) {
        const p = document.createElement("div");
        p.className = "msg " + role;
        p.textContent = text;
        return p;
    }

    function addMessage(role, text) {
        const p = makeMessage(role, text);
        messagesEl.appendChild(p);
        outputEl.scrollTop = outputEl.scrollHeight;
        return p;
    }

    /* ==================== 历史分页 ==================== */

    async function fetchHistory(beforeId) {
        const r = await fetch("/history", {
            method: "POST",
            headers: {"Content-Type": "application/json", ...authHeaders()},
            body: JSON.stringify({before_id: beforeId, limit: 30})
        });
        if (r.status === 401) { showAuth(); throw new Error("unauthorized"); }
        if (!r.ok) throw new Error("history failed");
        return r.json();
    }

    async function loadInitialHistory() {
        try {
            const data = await fetchHistory(null);
            if (!data.items.length) { showWelcome(); return; }
            messagesEl.innerHTML = "";
            for (const item of data.items) {
                messagesEl.appendChild(
                    makeMessage(item.role === "user" ? "user" : "ai", item.content)
                );
            }
            showMessages();
            outputEl.scrollTop = outputEl.scrollHeight;
            historyBefore = data.next_before_id;
            hasMoreHistory = data.has_more;
        } catch (e) {
            showWelcome();
        }
    }

    async function loadOlderHistory() {
        if (loadingHistory || !hasMoreHistory || !historyBefore) return;
        loadingHistory = true;
        const prevHeight = messagesEl.scrollHeight;
        try {
            const data = await fetchHistory(historyBefore);
            const frag = document.createDocumentFragment();
            for (const item of data.items) {
                frag.appendChild(
                    makeMessage(item.role === "user" ? "user" : "ai", item.content)
                );
            }
            messagesEl.insertBefore(frag, messagesEl.firstChild);
            outputEl.scrollTop += messagesEl.scrollHeight - prevHeight;
            historyBefore = data.next_before_id;
            hasMoreHistory = data.has_more;
        } catch (e) {
            console.error("加载更早消息失败", e);
        } finally {
            loadingHistory = false;
        }
    }

    // 滚到顶部自动加载上一页，保持滚动位置不跳动
    outputEl.addEventListener("scroll", () => {
        if (outputEl.scrollTop <= 8) loadOlderHistory();
    });

    /* ==================== 输入框状态 ==================== */

    function autoGrow() {
        msgInput.style.height = "auto";
        msgInput.style.height = Math.min(msgInput.scrollHeight, 200) + "px";
    }

    function updateSendState() {
        sendBtn.disabled = msgInput.value.trim().length === 0;
    }

    msgInput.addEventListener("input", () => {
        autoGrow();
        updateSendState();
    });
    msgInput.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey && !sendBtn.disabled) {
            e.preventDefault();
            sendBtn.click();
        }
    });

    // 示例问题 → 填入输入框
    document.querySelectorAll(".suggestion").forEach(btn => {
        btn.addEventListener("click", () => {
            msgInput.value = btn.dataset.prompt || btn.textContent;
            autoGrow();
            updateSendState();
            msgInput.focus();
        });
    });

    /* ==================== 发送消息 ==================== */

    sendBtn.addEventListener("click", async () => {
        const text = msgInput.value.trim();
        if (!text) return;

        msgInput.value = "";
        autoGrow();
        updateSendState();

        showMessages();
        scrollToLatest(messagesEl);

        addMessage("user", text);
        const loading = addMessage("ai", "");
        loading.classList.add("typing");
        loading.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
        scrollToLatest(loading);

        try {
            const r = await fetch("/chat/stream", {
                method: "POST",
                headers: {"Content-Type": "application/json", ...authHeaders(), ...apiKeyHeaders()},
                body: JSON.stringify({message: text})
            });
            if (r.status === 401) {
                showAuth();
                return;
            }
            if (!r.ok) {
                const result = await r.json();
                const errMsg = typeof result.detail === "string" ? result.detail : r.status;
                loading.classList.remove("typing");
                loading.textContent = "出错了 - " + errMsg;
                return;
            }
            const reader = await r.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let full = "";
            while (true) {
                const {value, done} = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, {stream: true});
                const parts = buffer.split("\n\n");
                buffer = parts.pop();
                for (const part of parts) {
                    if (!part.startsWith("data: ")) continue;
                    const content = part.slice(6);
                    if (content.startsWith("[START]")) continue;
                    if (content === "[DONE]") break;
                    if (content.startsWith("[ERROR]")) {
                        loading.classList.remove("typing");
                        loading.textContent = "出错了 - " + content;
                        return;
                    }
                    if (content === "") continue;
                    if (full === "") loading.classList.remove("typing");
                    full += content;
                    loading.textContent = full;
                    scrollToLatest(loading);
                    outputEl.scrollTop = outputEl.scrollHeight;
                }
            }

        } catch (e) {
            loading.classList.remove("typing");
            loading.textContent = "网络错误";
        }
    });

    /* ==================== 初始化 ==================== */

    async function init() {
        await loadInitialHistory();
    }

    // 页面加载：有 token 则直接进入应用，否则展示登录页
    if (authToken) {
        const storedName = localStorage.getItem(USER_KEY);
        if (storedName) userNameEl.textContent = storedName;
        refreshApiKeyChip();
        hideAuth();
        init();
    } else {
        setAuthMode("login");
        showAuth();
    }
</script>
</body>
</html>
