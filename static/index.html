<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 助手</title>
    <style>
        :root {
            --bg: hsl(48, 45%, 95%);
            --panel: hsl(48, 38%, 88%);
            --line: hsl(45, 22%, 76%);
            --txt: hsl(30, 20%, 22%);
            --sub: hsl(30, 12%, 42%);
            --accent: hsl(48, 50%, 78%);       /* 柔和米黄色 — 高亮态 */
            --hover: hsl(48, 30%, 82%);
            --pending: hsl(48, 40%, 91%);       /* 暖米色 — 等待智能命名 */
            --field: hsl(48, 50%, 98%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        [hidden] { display: none !important; }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
            background: var(--bg);
            color: var(--txt);
            height: 100vh;
            display: flex;
            overflow: hidden;
            user-select: none;
        }

        #app { display: flex; flex: 1; min-width: 0; }

        /* ---------- 登录 / 注册 ---------- */
        #auth-view {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(1100px 560px at 50% -12%, hsl(48, 55%, 92%), transparent),
                var(--bg);
        }

        .auth-card {
            width: 100%;
            max-width: 380px;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 32px 30px 28px;
            box-shadow: 0 20px 50px hsla(40, 30%, 50%, 0.16);
        }

        .auth-logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--accent);
            color: hsl(30, 20%, 18%);
            font-size: 26px;
            line-height: 52px;
            text-align: center;
            margin: 0 auto 18px;
        }

        .auth-card h2 {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin: 0 0 6px;
        }

        .auth-sub {
            text-align: center;
            font-size: 13px;
            color: var(--sub);
            margin: 0 0 24px;
        }

        .auth-tabs {
            display: flex;
            background: var(--panel);
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 24px;
        }

        .auth-tabs button {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--sub);
            font-family: inherit;
            font-size: 13.5px;
            padding: 7px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color .35s ease, color .35s ease;
        }
        .auth-tabs button.active {
            background: var(--accent);
            color: hsl(30, 20%, 18%);
        }

        .field { margin-bottom: 16px; }
        .field label {
            display: block;
            font-size: 12.5px;
            color: var(--sub);
            margin-bottom: 7px;
        }
        .field input {
            width: 100%;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--txt);
            font-family: inherit;
            font-size: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            outline: none;
            user-select: text;
            transition: border-color .3s ease, box-shadow .3s ease;
        }
        .field input::placeholder { color: var(--sub); }
        .field input:focus {
            border-color: hsl(45, 40%, 60%);
            box-shadow: 0 0 0 3px hsla(48, 50%, 70%, 0.25);
        }

        .auth-btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: hsl(30, 20%, 18%);
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 600;
            padding: 11px 0;
            cursor: pointer;
            margin-top: 6px;
            transition: filter .3s ease, opacity .3s ease;
        }
        .auth-btn:hover { filter: brightness(1.05); }
        .auth-btn:disabled { opacity: .6; cursor: not-allowed; filter: none; }

        .auth-msg {
            min-height: 18px;
            font-size: 12.5px;
            color: hsl(10, 42%, 52%);
            text-align: center;
            margin-top: 14px;
        }

        /* ---------- 侧边栏 ---------- */
        aside {
            width: 248px;
            height: 100vh;
            background: var(--panel);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }

        .side-top {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--sub);
            font-family: inherit;
            font-size: 13.5px;
            text-align: left;
            cursor: pointer;
        }
        .nav-item svg { width: 16px; height: 16px; flex: none; }
        .nav-item:hover { background: var(--hover); color: var(--txt); }
        .nav-item.active { background: var(--accent); color: hsl(30, 20%, 18%); }

        .chats-label {
            padding: 12px 20px 6px;
            font-size: 11px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--sub);
            flex-shrink: 0;
        }

        .session-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            list-style: none;
            padding: 0 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        /* 主题化细滚动条（只用 webkit 规则，勿与 scrollbar-width 混用） */
        .session-list::-webkit-scrollbar { width: 6px; }
        .session-list::-webkit-scrollbar-track { background: transparent; }
        .session-list::-webkit-scrollbar-button { display: none; height: 0; width: 0; }
        .session-list::-webkit-scrollbar-thumb {
            background: hsla(45, 22%, 68%, 0.5);
            border-radius: 999px;
        }
        .session-list::-webkit-scrollbar-thumb:hover {
            background: hsla(45, 25%, 55%, 0.8);
        }

        .session-item {
            flex-shrink: 0;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--sub);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background-color 0.45s cubic-bezier(.2,.7,.3,1),
                        color 0.35s ease,
                        box-shadow 0.45s ease;
        }
        .session-item:hover { background: var(--hover); color: var(--txt); }
        .session-item.active {
            background: var(--accent);
            color: hsl(30, 20%, 18%);
            box-shadow: 0 1px 3px hsla(45, 40%, 60%, 0.25);
        }

        /* 占位态：暖米色素描，等智能命名后柔滑过渡到米黄高亮 */
        .session-item.pending {
            background: var(--pending);
            color: hsl(40, 18%, 38%);
            box-shadow: inset 0 0 0 1px hsla(45, 30%, 72%, 0.6),
                        0 1px 6px hsla(48, 42%, 62%, 0.18);
            animation: pending-glow 2.8s ease-in-out infinite;
            cursor: default;
        }
        @keyframes pending-glow {
            0%, 100% {
                box-shadow: inset 0 0 0 1px hsla(45, 30%, 72%, 0.6),
                            0 1px 6px hsla(48, 42%, 62%, 0.18);
            }
            50% {
                box-shadow: inset 0 0 0 1px hsla(48, 40%, 65%, 0.55),
                            0 2px 10px hsla(48, 45%, 60%, 0.28);
            }
        }

        .side-bottom {
            position: relative;
            padding: 10px;
            border-top: 1px solid var(--line);
            flex-shrink: 0;
        }

        /* ---------- 底部用户栏 + 弹出菜单 ---------- */
        .user-cell {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 9px 10px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: var(--sub);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: background-color .35s ease, color .35s ease;
        }
        .user-cell:hover { background: var(--hover); color: var(--txt); }

        .user-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: left;
        }

        .user-dots {
            flex: none;
            display: inline-flex;
            gap: 2.5px;
            align-items: center;
        }
        .user-dots i {
            width: 3.5px;
            height: 3.5px;
            border-radius: 50%;
            background: currentColor;
        }

        .user-menu {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 10px;
            right: 10px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 6px;
            box-shadow: 0 12px 30px hsla(40, 30%, 40%, 0.18);
            z-index: 20;
            animation: menu-in .22s cubic-bezier(.2,.7,.3,1);
        }
        @keyframes menu-in {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-menu-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--sub);
            font-family: inherit;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            transition: background-color .3s ease, color .3s ease;
        }
        .user-menu-item:hover { background: var(--hover); color: var(--txt); }

        /* ---------- 主区域 ---------- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        header {
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 22px;
            border-bottom: 1px solid var(--line);
        }

        #chat-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--txt);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #output {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        /* ---------- 新会话欢迎页 ---------- */
        .welcome {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .welcome .logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--accent);
            color: hsl(30, 20%, 18%);
            font-size: 26px;
            line-height: 52px;
            margin-bottom: 18px;
        }

        .welcome h2 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 600;
        }

        .welcome p {
            margin: 0;
            font-size: 14px;
            color: var(--sub);
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 22px;
            max-width: 520px;
        }

        .suggestion {
            padding: 8px 16px;
            font-size: 13px;
            color: var(--txt);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
        }
        .suggestion:hover { background: var(--hover); }

        /* ---------- 消息列表 ---------- */
        .messages {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            user-select: text;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: hsl(30, 20%, 18%);
        }

        .msg.ai {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid var(--line);
        }

        /* 等待回复时的三点流动动画 */
        .msg.typing .dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            height: 1.5em;
            vertical-align: middle;
        }
        .msg.typing .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--sub);
            animation: typing-flow 1.2s infinite ease-in-out;
        }
        .msg.typing .dots span:nth-child(2) { animation-delay: 0.2s; }
        .msg.typing .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing-flow {
            0%, 60%, 100% { opacity: 0.25; transform: scale(0.75); }
            30% { opacity: 1; transform: scale(1.3); background: var(--accent); }
        }

        /* ---------- 输入栏（圆角卡片 + 工具栏） ---------- */
        .composer { padding: 10px 24px 20px; }

        .composer-inner {
            max-width: 760px;
            margin: 0 auto;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px 14px 8px;
        }

        #msg {
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: var(--txt);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            max-height: 200px;
            user-select: text;
        }
        #msg::placeholder { color: var(--sub); }

        .composer-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .spacer { flex: 1; }

        .icon-btn {
            width: 30px;
            height: 30px;
            flex: none;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: transparent;
            color: var(--sub);
            cursor: pointer;
        }
        .icon-btn svg { width: 15px; height: 15px; }
        .icon-btn:hover { background: var(--hover); color: var(--txt); }

        .chip {
            font-size: 12px;
            color: var(--sub);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 4px 10px;
            white-space: nowrap;
        }

        #send {
            width: 32px;
            height: 32px;
            flex: none;
            display: grid;
            place-items: center;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            color: hsl(30, 20%, 18%);
            cursor: pointer;
        }
        #send svg { width: 16px; height: 16px; }
        #send:hover { filter: brightness(1.08); }
        #send:disabled {
            background: hsl(48, 25%, 80%);
            color: var(--sub);
            cursor: not-allowed;
            filter: none;
        }
    </style>
</head>
<body>

    <!-- 登录 / 注册 -->
    <section id="auth-view">
        <div class="auth-card">
            <div class="auth-logo">✦</div>
            <h2 id="auth-title">欢迎回来</h2>
            <p class="auth-sub" id="auth-sub">登录后开始对话</p>

            <div class="auth-tabs">
                <button id="tab-login" class="active" type="button">登录</button>
                <button id="tab-register" type="button">注册</button>
            </div>

            <div class="field">
                <label for="auth-username">用户名</label>
                <input id="auth-username" type="text" placeholder="输入用户名" autocomplete="username">
            </div>
            <div class="field">
                <label for="auth-password">密码</label>
                <input id="auth-password" type="password" placeholder="输入密码" autocomplete="current-password">
            </div>
            <div class="field" id="confirm-field" hidden>
                <label for="auth-confirm">确认密码</label>
                <input id="auth-confirm" type="password" placeholder="再次输入密码" autocomplete="new-password">
            </div>

            <button class="auth-btn" id="auth-submit" type="button">登录</button>
            <p class="auth-msg" id="auth-msg"></p>
        </div>
    </section>

    <!-- 应用主体 -->
    <div id="app" hidden>

    <!-- 左侧边栏 -->
    <aside>
        <div class="side-top">
            <button class="nav-item" id="nav-new">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg>
                <span>新对话</span>
            </button>
            <button class="nav-item" id="nav-search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.2-4.2"/></svg>
                <span>搜索</span>
            </button>
            <button class="nav-item" id="nav-skill">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
                <span>技能</span>
            </button>
            <button class="nav-item" id="nav-project">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7l8.5-4 8.5 4v10l-8.5 4-8.5-4z"/><path d="M3.5 7l8.5 4 8.5-4M12 11v10"/></svg>
                <span>项目</span>
            </button>
        </div>

        <div class="chats-label">对话</div>
        <ul class="session-list" id="session-list"></ul>

        <div class="side-bottom">
            <button class="user-cell" id="user-menu-btn" type="button">
                <span class="user-name" id="user-name">用户</span>
                <span class="user-dots" aria-hidden="true"><i></i><i></i><i></i></span>
            </button>
            <div class="user-menu" id="user-menu" hidden>
                <button class="user-menu-item" id="menu-config" type="button">设置</button>
                <button class="user-menu-item" id="menu-logout" type="button">退出登录</button>
            </div>
        </div>
    </aside>

    <!-- 右侧主区域 -->
    <main>
        <header>
            <h1 id="chat-title">新对话</h1>
        </header>

        <!-- 消息区：欢迎页 与 消息列表 二选一 -->
        <div id="output">
            <!-- 新会话欢迎页 -->
            <section id="welcome" class="welcome">
                <div class="logo">✦</div>
                <h2>有什么可以帮到你？</h2>
                <p>输入你的问题，或者从下面的示例开始</p>
                <div class="suggestions">
                    <button class="suggestion" data-prompt="帮我总结下面这段文字：">帮我总结一段文字</button>
                    <button class="suggestion" data-prompt="解释一下什么是闭包">解释一下什么是闭包</button>
                    <button class="suggestion" data-prompt="用 Python 写一个简单的爬虫">用 Python 写一个爬虫</button>
                </div>
            </section>

            <!-- 消息列表 -->
            <div id="messages" class="messages" hidden></div>
        </div>

        <div class="composer">
            <div class="composer-inner">
                <textarea id="msg" rows="1" placeholder="输入消息，回车发送…" autocomplete="off"></textarea>
                <div class="composer-bar">
                    <button class="icon-btn" title="添加附件" type="button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                    <span class="chip">默认权限</span>
                    <span class="spacer"></span>
                    <span class="chip">deepseek</span>
                    <span class="chip">deepseek-v4-flash</span>
                    <button id="send" disabled title="发送">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>
    </div><!-- /#app -->

<script>
    /* ==================== 认证 ==================== */
    const TOKEN_KEY = "ai_chat_token";
    const USER_KEY = "ai_chat_username";
    let authToken = localStorage.getItem(TOKEN_KEY) || null;

    const authView = document.getElementById("auth-view");
    const appEl = document.getElementById("app");
    const userNameEl = document.getElementById("user-name");

    function authHeaders() {
        return authToken ? {"Authorization": "Bearer " + authToken} : {};
    }

    function showAuth() {
        authToken = null;
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_KEY);
        appEl.hidden = true;
        authView.hidden = false;
        setTimeout(() => document.getElementById("auth-username").focus(), 0);
    }

    function hideAuth() {
        authView.hidden = true;
        appEl.hidden = false;
    }

    // 登录 / 注册切换与提交
    let authMode = "login";
    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const authTitle = document.getElementById("auth-title");
    const authSub = document.getElementById("auth-sub");
    const confirmField = document.getElementById("confirm-field");
    const authSubmit = document.getElementById("auth-submit");
    const authMsg = document.getElementById("auth-msg");
    const usernameInput = document.getElementById("auth-username");
    const passwordInput = document.getElementById("auth-password");
    const confirmInput = document.getElementById("auth-confirm");

    function setAuthMode(mode) {
        authMode = mode;
        const isLogin = mode === "login";
        tabLogin.classList.toggle("active", isLogin);
        tabRegister.classList.toggle("active", !isLogin);
        confirmField.hidden = isLogin;
        authTitle.textContent = isLogin ? "欢迎回来" : "创建账号";
        authSub.textContent = isLogin ? "登录后开始对话" : "注册一个新账号";
        authSubmit.textContent = isLogin ? "登录" : "注册";
        passwordInput.setAttribute("autocomplete", isLogin ? "current-password" : "new-password");
        authMsg.textContent = "";
        usernameInput.focus();
    }

    tabLogin.addEventListener("click", () => setAuthMode("login"));
    tabRegister.addEventListener("click", () => setAuthMode("register"));

    function clearAuthFields() {
        usernameInput.value = "";
        passwordInput.value = "";
        confirmInput.value = "";
    }

    authSubmit.addEventListener("click", async () => {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        authMsg.textContent = "";

        if (!username || !password) {
            authMsg.textContent = "请输入用户名和密码";
            return;
        }
        if (authMode === "register") {
            if (password.length < 6) {
                authMsg.textContent = "密码至少 6 位";
                return;
            }
            if (password !== confirmInput.value) {
                authMsg.textContent = "两次输入的密码不一致";
                return;
            }
        }

        authSubmit.disabled = true;
        try {
            const r = await fetch("/" + authMode, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username, password})
            });
            const data = await r.json().catch(() => ({}));

            if (!r.ok) {
                authMsg.textContent = typeof data.detail === "string" ? data.detail : ("请求失败 " + r.status);
                return;
            }

            // 注册成功后跳转到登录页，让用户手动登录
            if (authMode === "register") {
                clearAuthFields();
                setAuthMode("login");
                authMsg.textContent = "注册成功，请登录";
                return;
            }

            authToken = data.access_token;
            localStorage.setItem(TOKEN_KEY, authToken);
            localStorage.setItem(USER_KEY, username);
            userNameEl.textContent = username;
            clearAuthFields();
            hideAuth();
            init();
        } catch (e) {
            authMsg.textContent = "网络错误，请稍后重试";
        } finally {
            authSubmit.disabled = false;
        }
    });

    [passwordInput, confirmInput].forEach(input => {
        input.addEventListener("keydown", e => {
            if (e.key === "Enter" && !authSubmit.disabled) {
                e.preventDefault();
                authSubmit.click();
            }
        });
    });

    /* ==================== 底部用户菜单 ==================== */
    const userMenuBtn = document.getElementById("user-menu-btn");
    const userMenu = document.getElementById("user-menu");

    userMenuBtn.addEventListener("click", e => {
        e.stopPropagation();
        userMenu.hidden = !userMenu.hidden;
    });

    document.addEventListener("click", e => {
        if (!userMenu.hidden && !userMenu.contains(e.target) && e.target !== userMenuBtn) {
            userMenu.hidden = true;
        }
    });

    document.getElementById("menu-config").addEventListener("click", () => {
        userMenu.hidden = true;
    });

    document.getElementById("menu-logout").addEventListener("click", () => {
        userMenu.hidden = true;
        showAuth();
    });

    /* 点击非可选中区域时清除文本选区（body 为 user-select:none，浏览器不会自动取消） */
    document.addEventListener("mousedown", e => {
        if (e.target.closest(".msg, #msg, .field input")) return;
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed) sel.removeAllRanges();
    });

    const outputEl = document.getElementById("output");
    const welcomeEl = document.getElementById("welcome");
    const messagesEl = document.getElementById("messages");
    const listEl = document.getElementById("session-list");
    const msgInput = document.getElementById("msg");
    const sendBtn = document.getElementById("send");
    const titleEl = document.getElementById("chat-title");

    // currentSession 存会话 uuid（后端生成的唯一标识，用来定位是哪个会话）
    // currentSessionName 只用于界面显示，二者分工不同
    let currentSession = null;      // uuid
    let currentSessionName = null;  // 显示名

    /* ==================== 视图切换 ==================== */

    function scrollToLatest(loadingEl) {
        outputEl.scrollTop = outputEl.scrollHeight;

        const outputTop = outputEl.getBoundingClientRect().top;
        const loadingTop = loadingEl.getBoundingClientRect().top;

        if (loadingTop < outputTop) {
            outputEl.scrollTop -= (outputTop - loadingTop);
        }
    }

    // 显示欢迎页（新会话状态）
    function showWelcome() {
        currentSession = null;
        currentSessionName = null;
        titleEl.textContent = "新对话";
        messagesEl.innerHTML = "";
        messagesEl.hidden = true;
        welcomeEl.hidden = false;
        outputEl.scrollTop = 0;
        document.querySelectorAll(".session-item")
            .forEach(el => el.classList.remove("active"));
        // 清除所有导航项高亮（如退出登录），并默认高亮“新对话”
        document.querySelectorAll(".nav-item")
            .forEach(el => el.classList.remove("active"));
        document.getElementById("nav-new").classList.add("active");
    }

    // 显示消息列表（已有会话状态）
    function showMessages() {
        welcomeEl.hidden = true;
        messagesEl.hidden = false;
        msgInput.focus();
    }

    // 往消息区追加一条消息
    function addMessage(role, text) {
        const p = document.createElement("div");
        p.className = "msg " + role;
        p.textContent = text;
        messagesEl.appendChild(p);
        outputEl.scrollTop = outputEl.scrollHeight;
        return p;
    }

    // 新建会话 = 回到欢迎页
    function createSession() {
        showWelcome();
        msgInput.value = "";
        autoGrow();
        updateSendState();
        msgInput.focus();
    }

    /* ==================== 侧边栏导航 ==================== */

    const navItems = document.querySelectorAll(".nav-item");
    navItems.forEach(item => {
        item.addEventListener("click", () => {
            navItems.forEach(i => i.classList.remove("active"));
            item.classList.add("active");
        });
    });

    document.getElementById("nav-new").addEventListener("click", () => {
        createSession();
    });

    /* ==================== 后端接口 ==================== */

    async function loadSessions() {
        const r = await fetch("/sessions", {headers: authHeaders()});
        if (r.status === 401) { showAuth(); return []; }
        const data = await r.json();
        return data.sessions;  // [{uuid, name}, ...]
    }

    async function loadHistory(uuid) {
        const r = await fetch("/history", {
            method: "POST",
            headers: {"Content-Type": "application/json", ...authHeaders()},
            body: JSON.stringify({session_uuid: uuid})
        });
        if (r.status === 401) { showAuth(); throw new Error("unauthorized"); }
        const data = await r.json();
        return {history: data.history, name: data.session};
    }

    /* ==================== 会话列表 ==================== */

    // 新会话占位项：先以偏白色高光出现，等智能命名后再变为黄色高光
    function addPendingSession(uuid) {
        document.querySelectorAll(".session-item")
            .forEach(el => el.classList.remove("active"));
        const li = document.createElement("li");
        li.className = "session-item pending";
        li.textContent = "新会话";
        li.dataset.uuid = uuid;
        li.addEventListener("click", () => openSession(uuid, "新会话", li));
        listEl.insertBefore(li, listEl.firstChild);
        return li;
    }

    async function refreshSessions() {
        let sessions = [];
        try {
            sessions = await loadSessions();
        } catch (e) {
            console.error("加载会话列表失败", e);
            return;
        }

        listEl.innerHTML = "";
        for (const s of sessions) {
            const li = document.createElement("li");
            li.className = "session-item";
            li.textContent = s.name;
            li.dataset.uuid = s.uuid;
            if (s.uuid === currentSession) li.classList.add("active");
            li.addEventListener("click", () => openSession(s.uuid, s.name, li));
            listEl.appendChild(li);
        }
    }

    async function openSession(uuid, name, li) {
        document.querySelectorAll(".session-item")
            .forEach(el => el.classList.remove("active"));
        if (li) li.classList.add("active");

        navItems.forEach(i => i.classList.remove("active"));

        currentSession = uuid;
        currentSessionName = name;
        titleEl.textContent = name;
        showMessages();
        messagesEl.innerHTML = "";

        try {
            const {history, name: serverName} = await loadHistory(uuid);
            currentSessionName = serverName;
            titleEl.textContent = serverName;
            for (const item of history) {
                addMessage(item.role === "user" ? "user" : "ai", item.content);
            }
        } catch (e) {
            addMessage("ai", "历史记录加载失败");
        }
    }

    /* ==================== 输入框状态 ==================== */

    function autoGrow() {
        msgInput.style.height = "auto";
        msgInput.style.height = Math.min(msgInput.scrollHeight, 200) + "px";
    }

    function updateSendState() {
        sendBtn.disabled = msgInput.value.trim().length === 0;
    }

    msgInput.addEventListener("input", () => {
        autoGrow();
        updateSendState();
    });
    msgInput.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey && !sendBtn.disabled) {
            e.preventDefault();
            sendBtn.click();
        }
    });

    // 示例问题 → 填入输入框
    document.querySelectorAll(".suggestion").forEach(btn => {
        btn.addEventListener("click", () => {
            msgInput.value = btn.dataset.prompt || btn.textContent;
            autoGrow();
            updateSendState();
            msgInput.focus();
        });
    });

    /* ==================== 发送消息 ==================== */

    sendBtn.addEventListener("click", async () => {
        const text = msgInput.value.trim();
        if (!text) return;

        msgInput.value = "";
        autoGrow();
        updateSendState();

        showMessages();
        scrollToLatest(messagesEl);

        addMessage("user", text);
        const loading = addMessage("ai", "");
        loading.classList.add("typing");
        loading.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
        scrollToLatest(loading);

        const isNewChat = currentSession === null;
        let pendingItem = null;
        const removePending = () => {
            if (pendingItem) { pendingItem.remove(); pendingItem = null; }
        };

        try {
            // 发给后端的 JSON：新会话只带 message；续聊时再带上 session_uuid
            const body = {message: text};
            if (currentSession) {
                body.session_uuid = currentSession;
            }

            const r = await fetch("/chat/stream", {
                method: "POST",
                headers: {"Content-Type": "application/json", ...authHeaders()},
                body: JSON.stringify(body)
            });
            if (r.status === 401) {
                showAuth();
                return;
            }
            if (!r.ok) {
                const result = await r.json();
                const errMsg = typeof result.detail === "string" ? result.detail : r.status;
                loading.classList.remove("typing");
                loading.textContent = "出错了 - " + errMsg;
                removePending();
                return;
            }
            const reader = await r.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let full = "";
            while (true) {
                const {value, done} = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, {stream: true});
                const parts = buffer.split("\n\n");
                buffer = parts.pop();
                for (const part of parts) {
                    if (!part.startsWith("data: ")) continue;
                    const content = part.slice(6);
                    // 后端把新会话的 uuid 放在流首帧 [START]<uuid> 里发回来，
                    // 前端存下它，之后所有请求（history / chat / stream）都带上它
                    if (content.startsWith("[START]")) {
                        currentSession = content.slice(7);
                        if (isNewChat && !pendingItem) {
                            pendingItem = addPendingSession(currentSession);
                        }
                        continue;
                    }
                    if (content === "[DONE]") break;
                    if (content.startsWith("[ERROR]")) {
                        loading.classList.remove("typing");
                        loading.textContent = "出错了 - " + content;
                        removePending();
                        return;
                    }
                    if (content === "") continue;
                    if (full === "") loading.classList.remove("typing");
                    full += content;
                    loading.textContent = full;
                    scrollToLatest(loading);
                    outputEl.scrollTop = outputEl.scrollHeight;
                }
            }

            // 重命名会话（只在新对话且有回复时触发）
            if (full && isNewChat) {
                try {
                    const r2 = await fetch("/chat", {
                        method: "POST",
                        headers: {"Content-Type": "application/json", ...authHeaders()},
                        body: JSON.stringify({session_uuid: currentSession})
                    });
                    if (r2.status === 401) {
                        showAuth();
                        return;
                    }
                    if (r2.ok) {
                        const data = await r2.json();
                        currentSessionName = data.session;
                        titleEl.textContent = data.session;
                        // 占位项由偏白色高光切到黄色高光
                        if (pendingItem) {
                            pendingItem.textContent = data.session;
                            pendingItem.classList.remove("pending");
                            pendingItem.classList.add("active");
                            pendingItem.onclick = () => openSession(currentSession, data.session, pendingItem);
                        }
                    }
                } catch (e) {
                    console.warn("会话重命名失败", e);
                }
            }

            if (full) {
                await refreshSessions();
            } else {
                removePending();
            }
        } catch (e) {
            loading.classList.remove("typing");
            loading.textContent = "网络错误";
            removePending();
        }
    });

    /* ==================== 初始化 ==================== */

    async function init() {
        createSession();
        await refreshSessions();
    }

    // 页面加载：有 token 则直接进入应用，否则展示登录页
    if (authToken) {
        const storedName = localStorage.getItem(USER_KEY);
        if (storedName) userNameEl.textContent = storedName;
        hideAuth();
        init();
    } else {
        setAuthMode("login");
        showAuth();
    }
</script>
</body>
</html>
