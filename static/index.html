<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 助手</title>
    <style>
        :root {
            --bg: hsl(48, 45%, 95%);
            --panel: hsl(48, 38%, 88%);
            --line: hsl(45, 22%, 76%);
            --txt: hsl(30, 20%, 22%);
            --sub: hsl(30, 12%, 42%);
            --accent: hsl(60, 71%, 63%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
        }

        [hidden] {
            display: none !important;
        }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
            background: var(--bg);
            color: var(--txt);
            height: 100vh;
            display: flex;
            overflow: hidden;
            user-select: none;
        }

        /* ---------- 侧边栏 ---------- */
        aside {
            width: 220px;
            background: var(--panel);
            border-right: 1px solid var(--line);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .brand {
            font-weight: 700;
            font-size: 15px;
            padding: 6px 8px 14px;
        }
        .brand span { color: var(--accent); }

        .item {
            padding: 9px 10px;
            border-radius: 8px;
            color: var(--sub);
            font-size: 13px;
            cursor: pointer;
        }
        .item:hover { background: hsl(48, 30%, 82%); color: var(--txt); }
        .item.active { background: var(--accent); color: hsl(30, 20%, 18%); }

        .session-divider {
            height: 1px;
            background: var(--line);
            margin: 10px 6px;
        }

        .session-label {
            padding: 4px 10px;
            font-size: 11px;
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .session-item {
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--sub);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-item:hover {
            background: hsl(48, 30%, 82%);
            color: var(--txt);
        }

        .session-item.active {
            background: hsl(60, 60%, 75%);
            color: hsl(30, 20%, 18%);
        }

        /* ---------- 主区域 ---------- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        header {
            height: 52px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            padding: 0 18px;
            font-size: 14px;
            gap: 10px;
        }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: #35d07f; }
        header small { color: var(--sub); margin-left: auto; font-size: 12px; }

        /* 消息区 */
        #output {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ---------- 新会话欢迎页 ---------- */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .welcome .logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--accent);
            color: hsl(30, 20%, 18%);
            font-size: 26px;
            line-height: 52px;
            margin-bottom: 18px;
        }

        .welcome h2 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 600;
        }

        .welcome p {
            margin: 0;
            font-size: 14px;
            color: var(--sub);
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 22px;
            max-width: 520px;
        }

        .suggestion {
            padding: 8px 16px;
            font-size: 13px;
            color: var(--txt);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
        }

        .suggestion:hover {
            background: hsl(48, 30%, 82%);
        }

        /* ---------- 消息列表 ---------- */
        .messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13.5px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg.user {
            background: var(--accent);
            color: hsl(30, 20%, 18%);
            align-self: flex-end;
        }

        .msg.ai {
            background: var(--panel);
            border: 1px solid var(--line);
            align-self: flex-start;
        }

        /* ---------- 输入栏 ---------- */
        .composer {
            padding: 14px 18px 18px;
            display: flex;
            gap: 10px;
        }

        #msg {
            flex: 1;
            background: hsl(48, 50%, 98%);
            border: 1px solid var(--line);
            color: var(--txt);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            outline: none;
        }

        #msg:focus { border-color: var(--accent); }

        #msg::placeholder { color: var(--sub); }

        #send {
            background: var(--accent);
            color: hsl(30, 20%, 18%);
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }

        #send:hover { filter: brightness(1.1); }

        #send:disabled {
            background: hsl(48, 25%, 80%);
            color: var(--sub);
            cursor: not-allowed;
            filter: none;
        }
    </style>
</head>
<body>

    <!-- 左侧边栏 -->
    <aside>
        <div class="brand">AI<span>助手</span></div>
        <div class="item active" id="nav-new">新任务</div>
        <div class="item" id="nav-skill">skill</div>
        <div class="item" id="nav-config">配置</div>

        <div class="session-divider"></div>
        <div class="session-label">历史会话</div>
        <ul class="session-list" id="session-list"></ul>
    </aside>

    <!-- 右侧主区域 -->
    <main>
        <header>
            <div class="dot"></div>
            <div>AI 对话</div>
            <small id="clock">--</small>
        </header>

        <!-- 消息区：欢迎页 与 消息列表 二选一 -->
        <div id="output">
            <!-- 新会话欢迎页 -->
            <section id="welcome" class="welcome">
                <div class="logo">✦</div>
                <h2>有什么可以帮到你？</h2>
                <p>输入你的问题，或者从下面的示例开始</p>
                <div class="suggestions">
                    <button class="suggestion" data-prompt="帮我总结下面这段文字：">帮我总结一段文字</button>
                    <button class="suggestion" data-prompt="解释一下什么是闭包">解释一下什么是闭包</button>
                    <button class="suggestion" data-prompt="用 Python 写一个简单的爬虫">用 Python 写一个爬虫</button>
                </div>
            </section>

            <!-- 消息列表 -->
            <div id="messages" class="messages" hidden></div>
        </div>

        <div class="composer">
            <input id="msg" type="text" placeholder="输入消息，回车发送…" autocomplete="off">
            <button id="send" disabled>发送</button>
        </div>
    </main>

<script>
    const outputEl = document.getElementById("output");
    const welcomeEl = document.getElementById("welcome");
    const messagesEl = document.getElementById("messages");
    const listEl = document.getElementById("session-list");
    const msgInput = document.getElementById("msg");
    const sendBtn = document.getElementById("send");

    let currentSession = null;

    /* ==================== 视图切换 ==================== */

    function scrollToLatest(loadingEl) {
        outputEl.scrollTop = outputEl.scrollHeight;

        const outputTop = outputEl.getBoundingClientRect().top;
        const loadingTop = loadingEl.getBoundingClientRect().top;

        if (loadingTop < outputTop) {
            outputEl.scrollTop -= (outputTop - loadingTop);
        }
    }

    // 显示欢迎页（新会话状态）
    function showWelcome() {
        currentSession = null;
        messagesEl.innerHTML = "";
        messagesEl.hidden = true;
        welcomeEl.hidden = false;
        outputEl.scrollTop = 0;
        document.querySelectorAll(".session-item")
            .forEach(el => el.classList.remove("active"));
    }

    // 显示消息列表（已有会话状态）
    function showMessages() {
        welcomeEl.hidden = true;
        messagesEl.hidden = false;
        msgInput.focus();
    }

    // 往消息区追加一条消息
    function addMessage(role, text) {
        const p = document.createElement("div");
        p.className = "msg " + role;
        p.textContent = text;
        messagesEl.appendChild(p);
        outputEl.scrollTop = outputEl.scrollHeight;
        return p;
    }

    // 新建会话 = 回到欢迎页
    function createSession() {
        showWelcome();
        msgInput.value = "";
        updateSendState();
        msgInput.focus();
    }

    /* ==================== 侧边栏导航 ==================== */

    const navItems = document.querySelectorAll(".item");
    navItems.forEach(item => {
        item.addEventListener("click", () => {
            navItems.forEach(i => i.classList.remove("active"));
            item.classList.add("active");
        });
    });

    document.getElementById("nav-new").addEventListener("click", () => {
        createSession();
    });

    /* ==================== 后端接口 ==================== */

    async function loadSessions() {
        const r = await fetch("/sessions");
        const data = await r.json();
        return data.sessions;
    }

    async function loadHistory(name) {
        const r = await fetch("/history", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({session: name})
        });
        const data = await r.json();
        return data.history;
    }

    /* ==================== 会话列表 ==================== */

    // 在列表中插入/更新一个会话项，返回该 li 元素
    function upsertSessionItem(name) {
        // 已存在则只更新激活态
        const existing = Array.from(listEl.children).find(li => li.textContent === name);
        if (existing) {
            document.querySelectorAll(".session-item").forEach(el => el.classList.remove("active"));
            existing.classList.add("active");
            return existing;
        }
        const li = document.createElement("li");
        li.className = "session-item active";
        li.textContent = name;
        document.querySelectorAll(".session-item").forEach(el => el.classList.remove("active"));
        li.addEventListener("click", () => openSession(name, li));
        listEl.insertBefore(li, listEl.firstChild);
        return li;
    }

    async function refreshSessions() {
        let sessions = [];
        try {
            sessions = await loadSessions();
        } catch (e) {
            console.error("加载会话列表失败", e);
            return;
        }

        listEl.innerHTML = "";
        for (const name of sessions) {
            const li = document.createElement("li");
            li.className = "session-item";
            li.textContent = name;
            if (name === currentSession) li.classList.add("active");
            li.addEventListener("click", () => openSession(name, li));
            listEl.appendChild(li);
        }
    }

    async function openSession(name, li) {
        document.querySelectorAll(".session-item")
            .forEach(el => el.classList.remove("active"));
        if (li) li.classList.add("active");

        // 切换侧边栏导航激活态
        navItems.forEach(i => i.classList.remove("active"));

        currentSession = name;
        showMessages();
        messagesEl.innerHTML = "";

        try {
            const history = await loadHistory(name);
            for (const item of history) {
                addMessage(item.role === "user" ? "user" : "ai", item.content);
            }
        } catch (e) {
            addMessage("ai", "历史记录加载失败");
        }
    }

    /* ==================== 输入框状态 ==================== */

    function updateSendState() {
        sendBtn.disabled = msgInput.value.trim().length === 0;
    }

    msgInput.addEventListener("input", updateSendState);
    msgInput.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey && !sendBtn.disabled) {
            e.preventDefault();
            sendBtn.click();
        }
    });

    // 示例问题 → 填入输入框
    document.querySelectorAll(".suggestion").forEach(btn => {
        btn.addEventListener("click", () => {
            msgInput.value = btn.dataset.prompt || btn.textContent;
            updateSendState();
            msgInput.focus();
        });
    });

    /* ==================== 发送消息 ==================== */

    sendBtn.addEventListener("click", async () => {
        const text = msgInput.value.trim();
        if (!text) return;

        msgInput.value = "";
        updateSendState();

        // 关键：从欢迎页切到消息列表
        showMessages();
        scrollToLatest(messagesEl);

        addMessage("user", text);
        const loading = addMessage("ai", "");
        scrollToLatest(loading);

        // 新会话：立刻在侧边栏插入"新会话"占位
        let sessionItemEl = null;
        const isNewChat = currentSession === null;
        if (isNewChat) {
            currentSession = "新会话";
            sessionItemEl = upsertSessionItem("新会话");
        }

        try {
            const r = await fetch("/chat/stream", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: text, session: currentSession})
            });
            if (!r.ok) {
                const result = await r.json();
                const errMsg = typeof result.detail === "string" ? result.detail : r.status;
                loading.textContent = "出错了 - " + errMsg;
                return;
            }
            const reader = await r.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let full = "";
            while (true) {
                const {value, done} = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, {stream: true});
                const parts = buffer.split("\n\n");
                buffer = parts.pop();
                for (const part of parts) {
                    if (!part.startsWith("data: ")) continue;
                    const content = part.slice(6);
                    if (content.startsWith("[START]")) {
                        currentSession = content.slice(7);
                        continue
                    }
                    if (content === "[DONE]") break;
                    if (content.startsWith("[ERROR]")) {
                        loading.textContent = "出错了 - " + content;
                        return;
                    }
                    full += content;
                    loading.textContent = full;
                    scrollToLatest(loading);
                    outputEl.scrollTop = outputEl.scrollHeight;
                }
            }

            // 流结束后再重命名，确保文件已保存到磁盘
            if (full && isNewChat && sessionItemEl) {
                try {
                    const r2 = await fetch("/chat", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({session: currentSession})
                    });
                    if (r2.ok) {
                        const data = await r2.json();
                        currentSession = data.session;
                        // 立即更新侧边栏该项的显示名称
                        sessionItemEl.textContent = data.session;
                        sessionItemEl.onclick = () => openSession(data.session, sessionItemEl);
                    }
                } catch (e) {
                    console.warn("会话重命名失败", e);
                }
            }

            if (full) {
                await refreshSessions()
            }
        } catch (e) {
            loading.textContent = "网络错误";
        }
    });

    /* ==================== 时钟 ==================== */

    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, "0");
        const m = String(now.getMinutes()).padStart(2, "0");
        document.getElementById("clock").textContent = h + ":" + m;
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* ==================== 初始化 ==================== */

    async function init() {
        createSession();      // 打开页面先进入新建会话页
        await refreshSessions();
    }

    init();
</script>
</body>
</html>
