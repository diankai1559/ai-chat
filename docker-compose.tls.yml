# 可选：域名 + 自动 HTTPS。没有域名时不要用这个文件，直接访问 IP:端口即可。
services:
  caddy:
    image: caddy:2-alpine
    container_name: xiaoman-caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
