services:
  app:
    build: .
    image: xiaoman:latest
    container_name: xiaoman
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RAG_MODEL_DIR: /opt/models
    ports:
      - "${HOST_PORT:-8010}:8000"
    volumes:
      - xiaoman-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: xiaoman-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - xiaoman-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  xiaoman-data:
  xiaoman-redis:
